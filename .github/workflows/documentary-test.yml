name: FACTVERSE Documentary Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-test:
    name: Pixazo Documentary Visual Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/documentary-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Pixazo secret
        run: |
          if [ -z "$PIXAZO_API_KEY" ]; then
            echo "ERROR: PIXAZO_API_KEY secret is missing"
            exit 1
          fi
          echo "PIXAZO_API_KEY: configured"

      - name: Load fixed test prompt
        run: |
          mkdir -p output
          cp data/documentary_pixazo_test.json output/metadata.json
          cp data/documentary_pixazo_test_plan.json output/documentary_plan.json
          echo "Using the exact prompt/metadata from the successful Gemini test; Gemini will NOT be called."

      - name: Generate test audio locally
        run: python src/generate_test_audio.py

      - name: Generate documentary clips with Pixazo LTX Free
        run: python src/pixazo_documentary_test.py

      - name: Mix documentary video with voice and music
        run: |
          ffmpeg -y \
            -i output/factverse_pixazo_documentary.mp4 \
            -i output/voice.wav \
            -i output/music.wav \
            -filter_complex "[1:a]volume=1.0,aresample=44100[voice];[2:a]volume=0.10,aresample=44100[music];[voice][music]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 160k -ar 44100 \
            -t 15 -movflags +faststart \
            output/factverse_pixazo_documentary_final.mp4

      - name: Verify final output
        run: |
          test -s output/factverse_pixazo_documentary_final.mp4
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/factverse_pixazo_documentary_final.mp4

      - name: Upload Pixazo documentary artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-pixazo-documentary-test
          path: |
            output/factverse_pixazo_documentary_final.mp4
            output/metadata.json
            output/documentary_plan.json
            output/documentary_timing.json
            output/pixazo_requests.json
          if-no-files-found: error
