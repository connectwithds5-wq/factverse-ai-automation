name: FACTVERSE Documentary Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-test:
    name: Documentary Style Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      YOUTUBE_PRIVACY_STATUS: private

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini secret
        run: test -n "$GEMINI_API_KEY" || { echo "ERROR: GEMINI_API_KEY missing"; exit 1; }

      - name: Generate normal FACTVERSE content
        run: python src/generate_with_strategy.py

      - name: Generate improved voice and music
        run: python src/add_audio.py

      - name: Build documentary visuals
        run: python src/documentary_test.py

      - name: Add the generated voice/music to documentary video
        run: |
          ffmpeg -y \
            -i output/factverse_documentary_test.mp4 \
            -i output/voice.wav \
            -i output/music.wav \
            -filter_complex "[1:a]volume=1.0,aresample=44100[voice];[2:a]volume=0.10,aresample=44100[music];[voice][music]amix=inputs=2:duration=first:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 160k -ar 44100 -shortest -movflags +faststart \
            output/factverse_documentary_test_final.mp4

      - name: Verify test output
        run: |
          test -f output/factverse_documentary_test_final.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/factverse_documentary_test_final.mp4

      - name: Upload documentary test artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-documentary-test
          path: |
            output/factverse_documentary_test_final.mp4
            output/metadata.json
            output/documentary_plan.json
          if-no-files-found: error
