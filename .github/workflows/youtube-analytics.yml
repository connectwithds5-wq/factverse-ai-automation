name: FACTVERSE Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: factverse-analytics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "YOUTUBE_OAUTH_JSON missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY missing"; exit 1; }
          python - <<'PY'
          import json, os
          d=json.loads(os.environ["YOUTUBE_OAUTH_JSON"])
          missing=[k for k in ("client_id","client_secret","refresh_token") if not d.get(k)]
          if missing: raise SystemExit("Missing OAuth fields: " + ", ".join(missing))
          print("YouTube OAuth JSON: OK")
          PY

      - name: Collect YouTube analytics
        run: python src/youtube_analytics.py

      - name: Build AI growth strategy
        run: python src/strategy_engine.py

      - name: Save analytics and strategy
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics_history.json data/strategy.json

          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi

          git commit -m "Update FACTVERSE analytics and AI strategy"

          # The repository can receive commits while this workflow is running
          # (for example, a production-code update). Rebase our analytics
          # commit onto the latest main before pushing instead of failing with
          # a non-fast-forward rejection.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"

            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Analytics push succeeded."
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing remote state..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
          done

          echo "ERROR: Could not push analytics after 3 attempts."
          exit 1

      - name: Upload analytics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factverse-analytics
          path: |
            data/analytics_history.json
            data/strategy.json
          if-no-files-found: error
