name: FACTVERSE Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: factverse-analytics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "YOUTUBE_OAUTH_JSON missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY missing"; exit 1; }
          python - <<'PY'
          import json, os
          d=json.loads(os.environ["YOUTUBE_OAUTH_JSON"])
          missing=[k for k in ("client_id","client_secret","refresh_token") if not d.get(k)]
          if missing: raise SystemExit("Missing OAuth fields: " + ", ".join(missing))
          print("YouTube OAuth JSON: OK")
          PY

      - name: Collect YouTube analytics
        run: python src/youtube_analytics.py

      - name: Build AI growth strategy
        run: python src/strategy_engine.py

      - name: Save analytics and strategy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics_history.json data/strategy.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
          else
            git commit -m "Update FACTVERSE analytics and AI strategy"
            git push
          fi

      - name: Upload analytics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factverse-analytics
          path: |
            data/analytics_history.json
            data/strategy.json
          if-no-files-found: error
