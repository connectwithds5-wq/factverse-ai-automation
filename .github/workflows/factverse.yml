name: FACTVERSE Daily Automation

on:

  workflow_dispatch:

  schedule:
    # Every day at 7:00 PM IST
    # 13:30 UTC = 19:00 IST
    - cron: "30 13 * * *"


permissions:
  contents: read


jobs:

  factverse:

    runs-on: ubuntu-latest

    steps:


      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================================================
      # 3. FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ==========================================================
      # 4. PYTHON DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================================
      # 5. GENERATE FACT VIDEO
      # ==========================================================

      - name: Generate FACTVERSE AI Video
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL: gemini-3.8-flash

        run: |

          python src/factverse_generate.py


      # ==========================================================
      # 6. ADD PIPER NEURAL VOICE + MUSIC
      # ==========================================================

      - name: Add Natural Voice and Music
        run: |

          python src/add_audio.py


      # ==========================================================
      # 7. CHECK OUTPUT
      # ==========================================================

      - name: Check generated files
        run: |

          echo "======================================"

          echo "FACTVERSE OUTPUT"

          echo "======================================"

          echo ""

          ls -lah output/

          echo ""

          echo "FINAL VIDEO"

          ls -lh output/factverse.mp4

          echo ""

          echo "METADATA"

          ls -lh output/metadata.json

          echo ""

          echo "VOICE"

          ls -lh output/voice.wav

          echo ""

          echo "MUSIC"

          ls -lh output/music.wav

          echo ""

          echo "======================================"


      # ==========================================================
      # 8. VIDEO ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Video
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: factverse-video

          path: output/factverse.mp4

          retention-days: 7


      # ==========================================================
      # 9. METADATA ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Metadata
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: factverse-metadata

          path: output/metadata.json

          retention-days: 7


      # ==========================================================
      # 10. SUCCESS
      # ==========================================================

      - name: FACTVERSE Success
        if: success()

        run: |

          echo "======================================"

          echo "     FACTVERSE V3 SUCCESS"

          echo "======================================"

          echo ""

          echo "AI fact generated."

          echo "Video generated."

          echo "Natural neural voice generated."

          echo "Voice cleaned and normalized."

          echo "Instrumental music added."

          echo "SEO metadata generated."

          echo "Final MP4 created."

          echo ""

          echo "FACTVERSE IS READY! 🚀"

          echo ""

          echo "Next: YouTube + Instagram automation."

          echo "======================================"
