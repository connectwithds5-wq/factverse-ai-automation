name: FACTVERSE Daily Automation

on:

  # Manual test
  workflow_dispatch:

  # Daily at 7:00 PM IST
  # 13:30 UTC = 19:00 IST
  schedule:
    - cron: "30 13 * * *"


permissions:
  contents: read


jobs:

  factverse:

    runs-on: ubuntu-latest

    steps:


      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================================================
      # 3. INSTALL FFMPEG + VOICE ENGINE
      # ==========================================================

      - name: Install FFmpeg and Voice Engine
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg espeak-ng


      # ==========================================================
      # 4. INSTALL PYTHON DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================================
      # 5. GENERATE AI FACT VIDEO
      # ==========================================================

      - name: Generate FACTVERSE AI Video
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Primary Gemini model
          GEMINI_MODEL: gemini-3.8-flash

        run: |

          python src/factverse_generate.py


      # ==========================================================
      # 6. ADD AI VOICE + INSTRUMENTAL MUSIC
      # ==========================================================

      - name: Add Voice and Instrumental Music
        run: |

          python src/add_audio.py


      # ==========================================================
      # 7. CHECK GENERATED FILES
      # ==========================================================

      - name: Check generated files
        run: |

          echo "======================================"

          echo "       FACTVERSE GENERATED FILES"

          echo "======================================"

          echo ""

          echo "Output directory:"

          ls -lah output/

          echo ""

          echo "Final video:"

          ls -lh output/factverse.mp4

          echo ""

          echo "Metadata:"

          ls -lh output/metadata.json

          echo ""

          echo "======================================"


      # ==========================================================
      # 8. UPLOAD VIDEO ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Video
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: factverse-video

          path: output/factverse.mp4

          retention-days: 7


      # ==========================================================
      # 9. UPLOAD METADATA ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Metadata
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: factverse-metadata

          path: output/metadata.json

          retention-days: 7


      # ==========================================================
      # 10. SUCCESS MESSAGE
      # ==========================================================

      - name: FACTVERSE Success
        if: success()
        run: |

          echo "======================================"

          echo "       FACTVERSE AUTOMATION SUCCESS"

          echo "======================================"

          echo ""

          echo "AI fact generated successfully."

          echo "Video generated successfully."

          echo "AI voice generated successfully."

          echo "Instrumental music added successfully."

          echo "SEO metadata generated successfully."

          echo "Video artifact uploaded successfully."

          echo ""

          echo "FACTVERSE V2 IS LIVE! 🚀"

          echo ""

          echo "Next stage: YouTube + Instagram automation."

          echo "======================================"
