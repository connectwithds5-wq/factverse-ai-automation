name: FACTVERSE AI Automation

on:
  workflow_dispatch:

  schedule:
    # Every day at 12:00 PM IST
    # 06:30 UTC
    - cron: "30 6 * * *"


permissions:
  contents: read


jobs:

  factverse:

    runs-on: ubuntu-latest


    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: pip


      # ==================================================
      # FFMPEG
      # ==================================================

      - name: Install FFmpeg

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ==================================================
      # PYTHON DEPENDENCIES
      # ==================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==================================================
      # GENERATE VIDEO
      # ==================================================

      - name: Generate FACTVERSE AI Video

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL: gemini-2.5-flash-lite

          USE_GEMINI: "true"

        run: |

          echo "======================================"

          echo "FACTVERSE 3.0"

          echo "ONE GEMINI REQUEST"

          echo "429 FALLBACK ENABLED"

          echo "======================================"

          python src/factverse_generate.py


      # ==================================================
      # CHECK VIDEO
      # ==================================================

      - name: Check generated files

        run: |

          test -f output/factverse.mp4

          test -f output/metadata.json

          echo "Generated files:"

          ls -lh output/factverse.mp4

          ls -lh output/metadata.json


      # ==================================================
      # VOICE + MUSIC
      # ==================================================

      - name: Add Natural Voice and Music

        run: |

          python src/add_audio.py


      # ==================================================
      # VERIFY FINAL VIDEO
      # ==================================================

      - name: Verify final video

        run: |

          test -f output/factverse.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/factverse.mp4


      # ==================================================
      # UPLOAD VIDEO ARTIFACT
      # ==================================================

      - name: Upload FACTVERSE Video

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: factverse-video

          path: output/factverse.mp4

          retention-days: 7


      # ==================================================
      # UPLOAD METADATA
      # ==================================================

      - name: Upload FACTVERSE Metadata

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: factverse-metadata

          path: output/metadata.json

          retention-days: 7


      # ==================================================
      # UPLOAD VOICE TEST
      # ==================================================

      - name: Upload Voice for Testing

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: factverse-voice

          path: output/voice.wav

          if-no-files-found: ignore

          retention-days: 3


      # ==================================================
      # YOUTUBE UPLOAD
      # ==================================================

      - name: Upload FACTVERSE to YouTube

        if: success()

        env:

          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}

          YOUTUBE_PRIVACY_STATUS: public

        run: |

          echo "======================================"

          echo "UPLOADING FACTVERSE TO YOUTUBE"

          echo "======================================"

          python src/upload_youtube.py


      # ==================================================
      # SUCCESS
      # ==================================================

      - name: FACTVERSE Success

        if: success()

        run: |

          echo "======================================"

          echo "FACTVERSE AUTOMATION SUCCESS"

          echo "======================================"

          echo "Google Trends    : DONE"

          echo "Gemini            : ONE REQUEST"

          echo "429 fallback      : READY"

          echo "Fact              : DONE"

          echo "SEO               : DONE"

          echo "Video             : DONE"

          echo "Voice + Music     : DONE"

          echo "YouTube Upload    : DONE"

          echo "======================================"


      # ==================================================
      # FAILURE
      # ==================================================

      - name: FACTVERSE Failure

        if: failure()

        run: |

          echo "======================================"

          echo "FACTVERSE AUTOMATION FAILED"

          echo "======================================"

          echo "Check the failed step above."

          echo "======================================"
