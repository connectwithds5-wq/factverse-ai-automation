name: FACTVERSE

on:
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload this generated video to YouTube"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"

concurrency:
  group: factverse-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-2.5-flash
  PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
  YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
  YOUTUBE_PRIVACY_STATUS: public

jobs:
  factverse:
    name: FACTVERSE AI Video
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg and ffprobe already available."
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "ERROR: GEMINI_API_KEY missing"; exit 1; }
          test -n "$PIXAZO_API_KEY" || { echo "ERROR: PIXAZO_API_KEY missing"; exit 1; }
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload_to_youtube }}" = "true" ]; then
            test -n "$YOUTUBE_OAUTH_JSON" || { echo "ERROR: YOUTUBE_OAUTH_JSON missing for upload"; exit 1; }
            python - <<'PY'
          import json, os
          data = json.loads(os.environ["YOUTUBE_OAUTH_JSON"])
          required = ["client_id", "client_secret", "refresh_token"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("Missing OAuth fields: " + ", ".join(missing))
          print("YOUTUBE_OAUTH_JSON: OK")
          PY
          fi
          echo "GEMINI_API_KEY: OK"
          echo "PIXAZO_API_KEY: OK"

      - name: Generate FACTVERSE story and metadata
        run: python src/generate_with_strategy.py

      - name: Reject duplicate published topic
        run: python src/duplicate_guard.py

      - name: Check generated metadata
        run: |
          test -s output/metadata.json
          python - <<'PY'
          import json
          data = json.load(open("output/metadata.json", encoding="utf-8"))
          for key in ("hook", "fact", "twist", "title", "description"):
              if not str(data.get(key, "")).strip():
                  raise SystemExit(f"ERROR: metadata field missing: {key}")
          print("Metadata validated.")
          PY
          cat output/metadata.json

      - name: Build aligned documentary storyboard
        run: python src/storyboard_builder.py

      - name: Check storyboard
        run: |
          test -s output/storyboard.json
          python - <<'PY'
          import json
          board = json.load(open("output/storyboard.json", encoding="utf-8"))
          shots = board.get("shots", [])
          if not 4 <= len(shots) <= 5:
              raise SystemExit("ERROR: storyboard must contain 4 or 5 shots")
          previous_end = 0.0
          for i, shot in enumerate(shots, 1):
              start = float(shot["start"])
              end = float(shot["end"])
              duration = end - start
              if i == 1 and abs(start) > 0.01:
                  raise SystemExit("ERROR: storyboard must start at 0")
              if abs(start - previous_end) > 0.01:
                  raise SystemExit(f"ERROR: shot {i} is not contiguous")
              if not 3.0 <= duration <= 5.0:
                  raise SystemExit(f"ERROR: shot {i} duration is {duration:.2f}s")
              if len(str(shot["caption"]).split()) > 8:
                  raise SystemExit(f"ERROR: shot {i} caption exceeds 8 words")
              if not str(shot.get("narration", "")).strip():
                  raise SystemExit(f"ERROR: shot {i} narration missing")
              previous_end = end
          if not 18.0 <= previous_end <= 22.0:
              raise SystemExit(f"ERROR: storyboard duration {previous_end:.2f}s is outside 18-22s")
          print(f"Storyboard validated: {len(shots)} shots, {previous_end:.2f}s")
          PY

      - name: Generate documentary visuals with Pixazo LTX Free
        run: python src/pixazo_documentary.py

      - name: Normalize Pixazo video to storyboard timing
        run: python src/normalize_video_duration.py

      - name: Add natural voice, cinematic music and mix
        run: python src/add_audio.py

      - name: Verify final production video
        run: |
          test -s output/factverse.mp4
          python - <<'PY'
          import json, subprocess
          board = json.load(open("output/storyboard.json", encoding="utf-8"))
          expected = float(board["shots"][-1]["end"])
          actual = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "output/factverse.mp4"
          ], text=True).strip())
          if actual < expected - 0.10 or actual > expected + 0.25:
              raise SystemExit(f"ERROR: final duration {actual:.3f}s does not match storyboard {expected:.3f}s")
          streams = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels",
              "-of", "json", "output/factverse.mp4"
          ], text=True))["streams"]
          video = [s for s in streams if s.get("codec_type") == "video"]
          audio = [s for s in streams if s.get("codec_type") == "audio"]
          if not video or not audio:
              raise SystemExit("ERROR: final video must contain both video and audio streams")
          if video[0].get("width") != 1080 or video[0].get("height") != 1920:
              raise SystemExit(f"ERROR: expected 1080x1920, got {video[0].get('width')}x{video[0].get('height')}")
          print(f"Final video: {actual:.3f}s, 1080x1920, audio={audio[0].get('codec_name')}")
          PY
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of default=noprint_wrappers=1 output/factverse.mp4

      - name: Upload FACTVERSE Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-video
          path: output/factverse.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload FACTVERSE Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-metadata
          path: output/metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Storyboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-storyboard
          path: output/storyboard.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pixazo Request Log
        uses: actions/upload-artifact@v4
        with:
          name: factverse-pixazo-log
          path: output/pixazo_requests.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Voice Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factverse-voice
          path: output/voice.wav
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload FACTVERSE to YouTube
        if: github.event_name == 'schedule' || inputs.upload_to_youtube == true
        run: python src/upload_youtube.py

      - name: Record published topic
        if: success() && (github.event_name == 'schedule' || inputs.upload_to_youtube == true)
        run: |
          python src/record_published.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_history.json
          git diff --cached --quiet || git commit -m "Record FACTVERSE publication history"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: FACTVERSE Success
        if: success()
        run: |
          echo "========================================"
          echo "       FACTVERSE SUCCESS"
          echo "========================================"
          echo "AI story + metadata generated."
          echo "Aligned storyboard generated."
          echo "Pixazo documentary visuals generated."
          echo "Natural neural voice + cinematic bed mixed."
          echo "Final video verified with video + audio streams."
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload_to_youtube }}" = "true" ]; then
            echo "YouTube upload completed and publication history recorded."
          else
            echo "Manual test mode: YouTube upload skipped."
          fi
