name: FACTVERSE

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"

concurrency:
  group: factverse-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  factverse:
    name: FACTVERSE AI Video
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      YOUTUBE_PRIVACY_STATUS: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg and ffprobe already available."
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "ERROR: GEMINI_API_KEY missing"; exit 1; }
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "ERROR: YOUTUBE_OAUTH_JSON missing"; exit 1; }
          python - <<'PY'
          import json, os
          data = json.loads(os.environ["YOUTUBE_OAUTH_JSON"])
          required = ["client_id", "client_secret", "refresh_token"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("Missing OAuth fields: " + ", ".join(missing))
          print("GEMINI_API_KEY: OK")
          print("YOUTUBE_OAUTH_JSON: OK")
          PY

      - name: Generate FACTVERSE AI Video
        run: python src/generate_with_strategy.py

      - name: Check generated files
        run: |
          test -f output/factverse.mp4 || { echo "ERROR: output/factverse.mp4 not found"; exit 1; }
          test -f output/metadata.json || { echo "ERROR: output/metadata.json not found"; exit 1; }
          ls -lh output/factverse.mp4 output/metadata.json

      - name: Add Natural Voice and Music
        run: python src/add_audio.py

      - name: Verify final video
        run: |
          test -f output/factverse.mp4 || { echo "ERROR: Final video not found"; exit 1; }
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/factverse.mp4

      - name: Upload FACTVERSE Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-video
          path: output/factverse.mp4
          if-no-files-found: error

      - name: Upload FACTVERSE Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: factverse-metadata
          path: output/metadata.json
          if-no-files-found: error

      - name: Upload Voice Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factverse-voice
          path: output/voice.wav
          if-no-files-found: ignore

      - name: Upload FACTVERSE to YouTube
        run: python src/upload_youtube.py

      - name: FACTVERSE Success
        if: success()
        run: |
          echo "========================================"
          echo "       FACTVERSE SUCCESS"
          echo "========================================"
          echo "AI strategy consumed."
          echo "Video generated and verified."
          echo "YouTube upload completed."
