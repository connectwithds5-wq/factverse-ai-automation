name: FACTVERSE AI Automation

on:

  workflow_dispatch:

  # Every day at 6:30 UTC = 12:00 PM IST
  schedule:
    - cron: "30 6 * * *"


permissions:
  contents: read


jobs:

  factverse:

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================================
      # 3. FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ==========================================================
      # 4. DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================================
      # 5. TRENDING FACT + VIDEO
      # ==========================================================

      - name: Generate FACTVERSE AI Video
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL: gemini-3.7-flash

        run: |

          echo "======================================"
          echo "FACTVERSE 2.0"
          echo "TRENDING TOPIC + VERIFIED FACT"
          echo "======================================"

          python src/factverse_generate.py


      # ==========================================================
      # 6. CHECK GENERATED FILES
      # ==========================================================

      - name: Check AI generated files
        run: |

          echo "======================================"
          echo "CHECKING GENERATED FILES"
          echo "======================================"

          ls -lah output/

          test -f output/factverse.mp4

          test -f output/metadata.json

          echo ""
          echo "Video: OK"
          echo "Metadata: OK"


      # ==========================================================
      # 7. NATURAL VOICE + MUSIC
      # ==========================================================

      - name: Add Natural Voice and Music
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          echo "======================================"
          echo "ADDING NATURAL VOICE + MUSIC"
          echo "======================================"

          python src/add_audio.py


      # ==========================================================
      # 8. VERIFY FINAL VIDEO
      # ==========================================================

      - name: Verify final video
        run: |

          echo "======================================"
          echo "VERIFYING FINAL VIDEO"
          echo "======================================"

          test -f output/factverse.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/factverse.mp4

          echo ""
          echo "FINAL VIDEO READY"


      # ==========================================================
      # 9. VIDEO ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Video
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: factverse-video

          path: output/factverse.mp4

          retention-days: 7


      # ==========================================================
      # 10. METADATA ARTIFACT
      # ==========================================================

      - name: Upload FACTVERSE Metadata
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: factverse-metadata

          path: output/metadata.json

          retention-days: 7


      # ==========================================================
      # 11. VOICE ARTIFACT
      # ==========================================================

      - name: Upload Voice for Testing
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: factverse-voice

          path: output/voice.wav

          if-no-files-found: ignore

          retention-days: 3


      # ==========================================================
      # 12. YOUTUBE UPLOAD
      # ==========================================================

      - name: Upload FACTVERSE to YouTube
        if: success()

        env:

          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}

          YOUTUBE_PRIVACY_STATUS: public

        run: |

          echo "======================================"
          echo "UPLOADING FACTVERSE TO YOUTUBE"
          echo "======================================"

          python src/upload_youtube.py


      # ==========================================================
      # 13. SUCCESS
      # ==========================================================

      - name: FACTVERSE Success
        if: success()

        run: |

          echo ""
          echo "======================================"
          echo "     FACTVERSE AUTOMATION SUCCESS"
          echo "======================================"
          echo ""
          echo "Trending Topic       : DONE"
          echo "Fact Verification    : DONE"
          echo "AI Video             : DONE"
          echo "Natural Voice        : DONE"
          echo "Music                : DONE"
          echo "SEO Metadata         : DONE"
          echo "Video Artifact       : DONE"
          echo "YouTube Upload       : DONE"
          echo "Privacy              : PUBLIC"
          echo ""
          echo "FACTVERSE 2.0 IS LIVE 🚀"
          echo "======================================"


      # ==========================================================
      # 14. FAILURE
      # ==========================================================

      - name: FACTVERSE Failure
        if: failure()

        run: |

          echo ""
          echo "======================================"
          echo "    FACTVERSE AUTOMATION FAILED"
          echo "======================================"
          echo ""
          echo "Please check the failed step above."
          echo ""
          echo "======================================"
