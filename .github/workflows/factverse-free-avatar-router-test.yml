name: FACTVERSE Free Avatar Router Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-avatar-test:
    name: Free avatar fallback one-shot test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_MODEL: gemini-2.5-flash
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
      AVATAR_DRIVE_FILE_ID: ${{ secrets.AVATAR_DRIVE_FILE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt gradio_client

      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "ERROR: GEMINI_API_KEY missing"; exit 1; }
          test -n "$AVATAR_DRIVE_FILE_ID" || { echo "ERROR: AVATAR_DRIVE_FILE_ID missing"; exit 1; }
          test -n "$HF_TOKEN_2" || { echo "ERROR: HF_TOKEN_2 missing"; exit 1; }

      - name: Download avatar
        run: |
          mkdir -p output
          curl -fL --retry 3 --connect-timeout 20 \
            "https://drive.usercontent.google.com/download?id=${AVATAR_DRIVE_FILE_ID}&export=download&confirm=t" \
            -o output/avatar_reference.jpg
          test -s output/avatar_reference.jpg

      - name: Build one storyboard
        run: |
          python src/generate_with_strategy.py
          python src/duplicate_guard.py
          python src/storyboard_builder.py

      - name: Zero-cost model fallback preflight
        run: python src/free_avatar_router.py

      - name: Generate exactly one avatar shot
        run: |
          timeout --signal=TERM --kill-after=20s 10m python src/free_avatar_one_shot.py

      - name: Verify output
        run: |
          test -s output/free_avatar_test.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/free_avatar_test.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/free_avatar_test.mp4

      - name: Upload one-shot test
        uses: actions/upload-artifact@v4
        with:
          name: factverse-free-avatar-test-${{ github.run_id }}
          path: |
            output/free_avatar_test.mp4
            output/free_avatar_voice.wav
            output/free_avatar_choice.json
            output/storyboard.json
            output/metadata.json
          retention-days: 7
